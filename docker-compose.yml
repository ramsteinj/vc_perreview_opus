services:
  db:
    image: postgres:16-alpine
    container_name: perreview_db
    environment:
      POSTGRES_DB: perreview
      POSTGRES_USER: perreview
      POSTGRES_PASSWORD: perreview
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perreview -d perreview"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
